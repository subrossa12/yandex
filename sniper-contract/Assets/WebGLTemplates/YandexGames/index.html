<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<title>Контракт</title>
<style>
  /*
   * Стандартный шаблон Unity модерацию не проходит: у него футер с
   * логотипом, своя кнопка полноэкранного режима, своя полоса загрузки
   * и уведомление про WebGL. Всё это убрано, канвас растянут на весь
   * экран, прелоадер свой.
   */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0d1014; overflow: hidden;
    /* п. 1.6.1.8 и 1.6.2.7: лонгтап не выделяет и не открывает меню */
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    /* нет браузерного скролла и swipe-to-refresh */
    overscroll-behavior: none; touch-action: none;
  }
  #unity-canvas {
    width: 100%; height: 100%; display: block;
    background: #0d1014; outline: none;
  }
  #preloader {
    position: fixed; inset: 0; display: flex; z-index: 5;
    flex-direction: column; align-items: center; justify-content: center;
    background: #0d1014; color: #cfd6de;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: opacity .35s ease;
  }
  #preloader.hidden { opacity: 0; pointer-events: none; }
  #preloader .mark { font-size: 34px; letter-spacing: .3em; margin-bottom: 18px; }
  #bar { width: min(260px, 60vw); height: 3px; background: #1e242c; border-radius: 2px; }
  #fill { width: 0; height: 100%; background: #7fa8c9; border-radius: 2px; transition: width .2s; }
  #note { margin-top: 12px; color: #6c7683; font-size: 13px; }
</style>
</head>
<body>

<canvas id="unity-canvas" tabindex="-1"></canvas>

<div id="preloader">
  <div class="mark">КОНТРАКТ</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="note">Выход на позицию…</div>
</div>

<!-- SDK Яндекс Игр. Относительный путь — как требуется для игр,
     загружаемых архивом. -->
<script src="/sdk.js"></script>

<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
(function () {
  'use strict';

  var canvas = document.querySelector('#unity-canvas');
  var preloader = document.querySelector('#preloader');
  var fill = document.querySelector('#fill');
  var instance = null;

  createUnityInstance(canvas, {
    dataUrl: 'Build/{{{ DATA_FILENAME }}}',
    frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
    codeUrl: 'Build/{{{ CODE_FILENAME }}}',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: '{{{ COMPANY_NAME }}}',
    productName: '{{{ PRODUCT_NAME }}}',
    productVersion: '{{{ PRODUCT_VERSION }}}',
    /* п. 1.6.1.7: никаких уведомлений про WebGL поверх игры */
    showBanner: function () {}
  }, function (progress) {
    fill.style.width = Math.round(progress * 100) + '%';
  }).then(function (result) {
    instance = result;
    preloader.classList.add('hidden');
    setTimeout(function () { preloader.style.display = 'none'; }, 400);
  }).catch(function (e) {
    document.querySelector('#note').textContent = 'Не удалось загрузить: ' + e;
  });

  /*
   * п. 1.3: звук замолкает, когда вкладку свернули. Одного
   * visibilitychange мало — сворачивание окна браузера не везде его
   * даёт, поэтому глушим и по blur.
   */
  function mute(on) {
    if (!instance) return;
    try { instance.SetFullscreen; } catch (e) { /* игнорируем */ }
    try {
      instance.Module.SetVolume ? instance.Module.SetVolume(on ? 0 : 1) : null;
    } catch (e) { /* движок ещё не готов */ }
  }

  document.addEventListener('visibilitychange', function () { mute(document.hidden); });
  window.addEventListener('blur', function () { mute(true); });
  window.addEventListener('focus', function () { mute(false); });

  /* Правая кнопка и лонгтап не должны открывать меню поверх игры. */
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* Мобилка: полноэкранный режим по первому касанию (п. 1.6.1.1).
     Запросить его без жеста браузер не даст, поэтому вешаемся на
     первое же касание и снимаем обработчик. */
  function goFullscreen() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) { /* пользователь откажется — не беда */ } }
    window.removeEventListener('touchend', goFullscreen);
  }
  if ('ontouchstart' in window) window.addEventListener('touchend', goFullscreen);
})();
</script>
</body>
</html>
